# This workflow will build and verify the TNH Golang project on every push
# Designed for ThitNueaHub Enterprise Protocol (zero_garbage)

name: Go Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Go Runtime
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: true # ⚡ เปิดท่อจำความจำ ช่วยเซฟพลังงานและลดเวลาคอมไพล์ลง 50%

    - name: 🧼 5S Audit (Check Code Format)
      run: |
        if [ -n "$(go fmt ./...)" ]; then
          echo "❌ [garbage_detected] พบไฟล์ที่จัดฟอร์แมตไม่สะอาด ไม่ผ่านกฎ 5ส คับบอส!"
          exit 1
        fi
        echo "✅ [status] โค้ดสะอาดกริบ ไร้เศษขยะอักษร"

    - name: 🛡️ Go Vet (Static Code Analysis)
      run: go vet ./...

    - name: 🛠️ Build TNH Engine
      run: go build -v -o tnh_engine cmd/main.go

    - name: 🧪 Test Core Pipeline
      env:
        # ดึงกุญแจลับ HMAC ผูกจากระบบความปลอดภัยหลังบ้านของ GitHub ไม่ทิ้งรอยเท้าบนคลาวด์
        TNH_SECRET_KEY: ${{ secrets.TNH_SECRET_KEY }}
        CORE_DOMAIN: "arthitsiangwan.dev"
      run: go test -v ./...
      
