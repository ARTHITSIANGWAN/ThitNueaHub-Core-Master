# This workflow will build and verify the TNH Golang project on every push
# Designed for ThitNueaHub Enterprise Protocol (zero_garbage)

name: Go Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Go Runtime
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
        cache: true

    - name: 🧼 5S Audit (Check Code Format)
      run: |
        if [ -n "$(go fmt ./...)" ]; then
          echo "❌ [garbage_detected] Code formating issue found!"
          exit 1
        fi
        echo "✅ [status] Code is clean and compliant with 5S standards."

    - name: 🛡️ Go Vet (Static Code Analysis)
      run: go vet ./...

    - name: 🛠️ Build TNH Engine
      run: go build -v -o tnh_engine cmd/main.go

    - name: 🧪 Test Core Pipeline
      env:
        TNH_SECRET_KEY: ${{ secrets.TNH_SECRET_KEY }}
        CORE_DOMAIN: "thitnueahub.dev"
      run: go test -v ./...
      
