name: TNH_AI_SOOD_SOI_MASTER
on:
  workflow_dispatch: # สั่งรันมือได้ตลอดเวลาจาก Chrome Dev
  push:
    branches:
      - master # ล็อกไว้ที่กิ่งหลักของเทมเพลต

jobs:
  push_to_empire:
    runs-on: ubuntu-latest
    steps:
      - name: 🛡️ Step 1: Checkout Source (5S Audit)
        uses: actions/checkout@v4

      - name: ⏳ Step 2: เปิดสะพานล่องหน ดึงมหาจักรวรรดิมารวมศูนย์
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          git config --global user.name "TNH-AI-JOD-L5"
          git config --global user.email "jod@tnh.ai"
          
          # ตัวอย่างโครงสร้างที่บอสทำ: สร้างโฟลเดอร์ปลายทางอัตโนมัติ
          TARGET_DIR="destination"
          mkdir -p $TARGET_DIR
          
          echo "⚡ [Ignite]: เตรียมระบบซิงค์มหาจักรวรรดิ 20 โปรเจกต์..."
          
