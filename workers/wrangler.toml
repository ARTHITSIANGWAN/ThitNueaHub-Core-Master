# === ThitNueaHub Secret Key Parameters ===
# รหัสลับสำหรับใช้เซ็นและถอดรหัส HMAC-SHA256 (ต้องตรงกับในโค้ด main.go)
TNH_SECRET_KEY=thitnueahub_secret_token_v86

# === Cloudflare Edge Deployment Configurations ===
# ค่าสำหรับใช้สั่ง Deploy ผ่าน wrangler deploy ไปยังบัญชี Cloudflare ของพี่
CLOUDFLARE_ACCOUNT_ID=ใส่รหัสบัญชีCloudflareของพี่ตรงนี้
CLOUDFLARE_API_TOKEN=ใส่รหัสตั๋วTokenของCloudflareตรงนี้

# === Telemetry & Security Mode ===
# เปิดระบบผู้พิทักษ์ (Guardians) และโหมด Tracing คุมกฎเหล็ก 5ส
TNH_SECURITY_LEVEL=MAXIMUM
TNH_TRACING_MODE=RECORD_UNTIL_FULL
