name = "tnh-fortress"
main = "workers/index.js" # หรือไฟล์ Go ที่คอมไพล์แล้ว
compatibility_date = "2026-07-04"

# --- ท่อ D1 (ฐานข้อมูลความรู้) ---
[[d1_databases]]
binding = "DB"
database_name = "tnh-knowledge"
database_id = "..." # เจ้านายเติม ID ที่สร้างใน Dashboard

# --- ท่อ R2 (เก็บ Model .safetensors) ---
[[r2_buckets]]
binding = "MODEL_STORE"
bucket_name = "tnh-models"

# --- ท่อ Service Binding (เชื่อมบอท A2A) ---
[[services]]
binding = "KAEWTA_AGENT"
service = "kaewta-service"
